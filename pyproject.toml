[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"
[project]
name = "ledgerlens"
version = "0.1.0"
description = "Connect SEC financial statements with cash generation, capital efficiency and filing evidence."
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1", "starlette==1.3.1", "httpx==0.28.1", "pydantic==2.13.5", "uvicorn==0.52.4"]
[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.12.12", "mypy==1.19.1", "build==1.4.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
python_version = "3.12"
strict = true
[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]
